name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # Debugging: Pastikan file Google Console ada di folder dist
      - name: Check Build Output
        run: ls -la dist

      - name: Deploy to External Repository
        uses: peaceiris/actions-gh-pages@v3
        with:
          # PENTING: Pake PERSONAL_TOKEN buat nembak repo lain
          personal_token: ${{ secrets.PERSONAL_TOKEN }}

          # PENTING: Arahkan ke repo tujuan (yang live website)
          external_repository: h4nzs/portofolio

          publish_dir: ./dist
          # Ini wajib true biar history bersih & gak konflik, 
          # tapi aman karena file Google udah kita taruh di folder public
          force_orphan: true
          user_name: 'h4nzs'
          user_email: 'sayadehan134@gmail.com' # Ganti email lu kalau mau

