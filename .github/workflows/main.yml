name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # PERBAIKAN: permissions harus menjorok ke dalam (sejajar dengan runs-on)
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          # Kita pake token bawaan aja (lebih aman & praktis)
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
